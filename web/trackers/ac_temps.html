<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air conditioning temperatures</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Air conditioning temperatures</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Air conditioning temperatures",
  sub: "Mats input and output and the dehumidifier output. One-minute averages.",
  sources: {
    ac: { url: "/realtime/getactemps", map: (r) => ({ matsIn: r.MatsInput, matsOut: r.MatsOutput, dehum: r.DehumidifierOutput }) },
  },
  charts: [{
    source: "ac", unit: "°C", decimals: 1, minSpan: 10, gapMs: 600000, height: 320,
    series: [
      { label: "Mats input", color: "--series-1", key: "matsIn" },
      { label: "Mats output", color: "--series-2", key: "matsOut" },
      { label: "Dehumidifier output", color: "--series-3", key: "dehum" },
    ],
  }],
  live: (m) => m.temps && { ac: { t: m.temps.time, matsIn: m.temps.matsInput, matsOut: m.temps.matsOutput, dehum: m.temps.dehumidifierOutput } },
});
</script>
</body>
</html>
