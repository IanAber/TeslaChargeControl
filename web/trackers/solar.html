<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar PV strings</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Solar PV strings</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
// String letters as logged (a..k) and the names on the inverters. Each
// inverter keeps one colour; its strings A, B and C are solid, dashed and dotted.
const STRINGS = [
  ["j", "1-A", 1, ""], ["k", "1-B", 1, "dash"],
  ["a", "2-A", 2, ""], ["b", "2-B", 2, "dash"], ["c", "2-C", 2, "dot"],
  ["d", "3-A", 3, ""], ["e", "3-B", 3, "dash"], ["f", "3-C", 3, "dot"],
  ["g", "4-A", 4, ""], ["h", "4-B", 4, "dash"], ["i", "4-C", 4, "dot"],
];
const PARAMS = { watts: ["W"], volts: ["V"], amps: ["A"] };

function mapRow(r) {
  const out = { total: 0 };
  for (const [s] of STRINGS) for (const p in PARAMS) out[p + "_" + s] = r[p + "_" + s];
  for (const [s] of STRINGS) out.total += r["watts_" + s] || 0;
  return out;
}

const charts = [
  { source: "solar", title: "Total power", unit: "W", decimals: 0, zero: true, minSpan: 100, height: 200,
    series: [{ label: "Total", color: "--series-1", key: "total" }] },
  { source: "solar", unit: (p) => PARAMS[p][0], decimals: 1, zero: true, height: 360,
    series: (p) => STRINGS.map(([s, name, inv, dash]) => ({ label: "Inverter " + name, color: "--series-" + inv, dash, key: p + "_" + s })) },
];

SC.tracker({
  title: "Solar PV strings",
  sub: "Power, voltage or current for each string on the four string inverters.",
  ranges: [15, 30, 60, 120, 240, 480, 720, 1440, 2880, 4320, 10080],
  defaultRange: 120,
  selector: { label: "Show", value: "watts", options: [
    { value: "watts", label: "Power (W)" }, { value: "volts", label: "Voltage (V)" }, { value: "amps", label: "Current (A)" } ] },
  sources: { solar: { url: "/realtime/getSolar", map: mapRow } },
  charts,
  live: (m) => {
    if (!m.solar) return null;
    const r = { t: m.solar.time };
    const letters = "abcdefghijk";
    m.solar.strings.forEach((s, i) => {
      if (i >= letters.length) return;
      r["watts_" + letters[i]] = s.watts; r["volts_" + letters[i]] = s.volts; r["amps_" + letters[i]] = s.amps;
    });
    r.total = m.solar.total;
    return { solar: r };
  },
});
</script>
</body>
</html>
