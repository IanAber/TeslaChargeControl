<html lang="en">
<head>
    <title id='Description'>Cedar Technology Insolation Sensor Readings Tracker</title>
    <link rel="stylesheet" href="../jqwidgets/styles/jqx.base.css" type="text/css" />
    <link rel="stylesheet" href="../jqwidgets/styles/jqx.web.css" type="text/css" />
    <script type="text/javascript" src="../scripts/jquery-1.11.1.min.js"></script>
    <script type="text/javascript" src="../jqwidgets/jqxcore.js"></script>
    <script type="text/javascript" src="../jqwidgets/jqxchart.core.js"></script>
    <script type="text/javascript" src="../jqwidgets/jqxdraw.js"></script>
    <script type="text/javascript" src="../jqwidgets/jqxdata.js"></script>
    <script type="text/javascript">

    var solarTimeOut;
	var trackerURL = "../realtime/getInsolation.php"

	function buildSolarURL() {
        end = new Date();
        start = new Date(end - document.getElementById("timeRange").value)
		if(document.getElementById("timeRange").value > 14400000) {
			trackerURL = "../realtime/getInsolationBy5Min.php";
		} else {
			trackerURL = "../realtime/getInsolation.php";
		}

        return encodeURI(trackerURL+"?start="
                        + start.getFullYear() + "-" + (start.getMonth() + 1) + "-" + start.getDate() + " " + start.getHours() + ":" + start.getMinutes() + ":" + start.getSeconds()
                        + "&end=" + end.getFullYear() + "-" + (end.getMonth() + 1) + "-" + end.getDate() + " " + end.getHours() + ":" + end.getMinutes() + ":" + end.getSeconds());
	}

		function xAxisFormatFunction(value, itemIndex, series, group) {
        	var dt = new Date(value * 1000);
			return dt.getHours().toLocaleString('en-US', {minimumIntegerDigits: 2, useGrouping:false}) + ":"
													 + dt.getMinutes().toLocaleString('en-US', {minimumIntegerDigits: 2, useGrouping:false});
        }

        $(document).ready(function () {
			var solarSettings = {
				title: "Cedar Technology",
				description: "Solar Array String Power Generation.",
				enableAnimations: false,
				animationDuration: 1000,
				enableAxisTextAnimation: true,
				showLegend: true,
				padding: { left: 5, top: 5, right: 5, bottom: 5 },
				titlePadding: { left: 90, top: 0, right: 0, bottom: 10 },
				colorScheme: 'scheme04',
				categoryAxis: {
					dataField: 'logged',
					showGridLines: false,
					textRotationAngle: 270,
					unitInterval: 1800,
					formatFunction: xAxisFormatFunction
				},
				colorScheme: 'scheme01',
				seriesGroups: [{
					type: 'spline',
					valueAxis: {
						interval: 1,
						gridLines: {
							visible: true,
							step: 1,
						},
						labels: {
							formatSettings: {
								decimalPlaces: 0,
							},
							visible: true,
							step: 1,
						},
						minValue: 0,
						maxValue: 100,
						description: 'Insolation',
					},
					series: [{
						dataField: 'Insolation',
						displayText: 'Insolation',
						lineColor: '#80E080',
						fillColor: '#80E080',
					}]
				}]
			};


			$('#solarChartContainer').jqxChart(solarSettings);
			solarTimeOut = setInterval(getSolar, 15000);
			getSolar();
		});
								
		function getSolar() {
			fetch(buildSolarURL())
				.then( function(response) {
					if (response.status == 200) {
						response.json()
							.then(function(data) {

                            	now = new Date();
                            	end = Math.trunc(now.getTime() / 1000);
                            	start = end - document.getElementById("timeRange").value / 1000;
			    				$('#solarChartContainer').jqxChart({source:data.data});
								$('#solarChartContainer').jqxChart('refresh');
                            	$('#solarChartContainer').jqxChart({categoryAxis:{
                                	dataField: 'logged',
                        	        showGridLines: false,
                            	    textRotationAngle: 270,
                                	unitInterval: document.getElementById("timeRange").value / 24000,
                                	formatFunction: xAxisFormatFunction,
                                	minValue: start,
                                	maxValue: end}});
                            	$('#solarChartContainer').jqxChart('update');
                        });
                    }
                })
				.catch(function(err) {
					if(err.name === "TypeError" && err.message != "cancelled") {
						alert('Solar Fetch Error :-S' + err.message);
					}
				});
		};
		
		function goBack() {
			window.clearInterval(solarTimeOut);
			if (window.history.length > 1) {
				setTimeout(window.history.back(), 1000);
			} else {
				setTimeout(window.close(), 1000);
			}
		}
    </script>
</head>
    <body style="background:white;">
        <div id='solarChartContainer' style="width:100%; height: 96%" ></div>
		<div style="text-align:center; width:100%; height: 4%">
            <button onClick="goBack()" style="width:50%;height:100%" >Back</button>
            <select id="timeRange" onchange="getSolar()">
                <option value=259200000>3 Days</option>
                <option value=172800000>2 Days</option>
                <option value=86400000>24 Hours</option>
                <option value=43200000>12 Hours</option>
                <option value=28800000>8 Hours</option>
                <option value=14400000>4 Hours</option>
                <option value=7200000 selected="selected">2 Hours</option>
                <option value=3600000>1 Hour</option>
                <option value=1800000>30 Minutes</option>
            </select>
        </div>
    </body>
</html>
