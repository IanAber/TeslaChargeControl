<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot tank temperatures</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Hot tank temperatures</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Hot tank temperatures",
  sub: "Top, middle and bottom of the hot tank, and the weighted trigger temperature the heater controls on. One-minute averages.",
  sources: {
    tank: { url: "/realtime/gethottank", map: (r) => ({ top: r.TSH0, middle: r.TSH2, bottom: r.TSH1, trigger: r.mean }) },
  },
  charts: [{
    source: "tank", unit: "°C", decimals: 1, minSpan: 10, gapMs: 600000, height: 320,
    series: [
      { label: "Top", color: "--series-1", key: "top" },
      { label: "Middle", color: "--series-2", key: "middle" },
      { label: "Bottom", color: "--series-3", key: "bottom" },
      { label: "Trigger (weighted)", color: "--series-4", dash: "dash", key: "trigger" },
    ],
  }],
  live: (m) => m.temps && { tank: { t: m.temps.time, top: m.temps.hotTankTop, middle: m.temps.hotTankMiddle, bottom: m.temps.hotTankBottom,
    trigger: (3 * m.temps.hotTankTop + 2 * m.temps.hotTankMiddle + m.temps.hotTankBottom) / 6 } },
});
</script>
</body>
</html>
