<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiller loop temperatures</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Chiller loop temperatures</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Chiller loop temperatures",
  sub: "Ground loop, house loop, chiller output and bypass.",
  sources: {
    loop: { url: "/realtime/getLoopTemps", map: (r) => ({ groundIn: r.GroundLoopIn, groundOut: r.GroundLoopOut, toHouse: r.ToHouse,
                                                         fromHouse: r.FromHouse, chiller: r.ChillerOut, bypass: r.Bypass }) },
  },
  charts: [{
    source: "loop", unit: "°C", decimals: 1, minSpan: 10, gapMs: 600000, height: 340,
    series: [
      { label: "Ground loop in", color: "--series-1", key: "groundIn" },
      { label: "Ground loop out", color: "--series-2", key: "groundOut" },
      { label: "To house", color: "--series-3", key: "toHouse" },
      { label: "From house", color: "--series-4", key: "fromHouse" },
      { label: "Chiller out", color: "--series-5", key: "chiller" },
      { label: "Bypass", color: "--series-6", key: "bypass" },
    ],
  }],
  live: (m) => m.temps && { loop: { t: m.temps.time, groundIn: m.temps.groundLoopIn, groundOut: m.temps.groundLoopOut, toHouse: m.temps.toHouse,
                                    fromHouse: m.temps.fromHouse, chiller: m.temps.chillerOut, bypass: m.temps.bypass } },
});
</script>
</body>
</html>
