<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla charging</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Tesla charging</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Tesla charging",
  sub: "Current the controller makes available to the car, and the current the car is drawing.",
  ranges: [30, 60, 120, 240, 480, 720, 1440, 2880, 4320],
  defaultRange: 240,
  sources: {
    tesla: { url: "/realtime/getTesla", step: true, map: (r) => ({ available: r.iSetpoint, charging: r.iCharging }) },
  },
  charts: [{
    source: "tesla", unit: "A", decimals: 1, min: 0, max: 48, height: 300,
    series: [
      { label: "Available", color: "--series-1", key: "available" },
      { label: "Charging", color: "--series-2", key: "charging" },
    ],
  }],
  live: (m) => ({ tesla: { t: m.time, available: m.tesla.maxAmps, charging: m.tesla.current } }),
});
</script>
</body>
</html>
