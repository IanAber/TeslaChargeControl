<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar hot water</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Solar hot water</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Solar hot water",
  sub: "Solar collector temperature, the water going into and coming out of it, and the pump speed. The controller logs the pump speed each time it changes.",
  sources: {
    solar: { url: "/realtime/getsolartemps", map: (r) => ({ collector: r.SolarCollector, inlet: r.SolarInlet, outlet: r.SolarOutlet }) },
    pump: { url: "/realtime/getpumps", step: true, map: (r) => ({ speed: r.power }) },
  },
  charts: [{
    source: "solar", title: "Collector temperature", unit: "°C", decimals: 1, minSpan: 10, gapMs: 600000, height: 300,
    series: [
      { label: "Collector", color: "--series-1", key: "collector" },
      { label: "Inlet", color: "--series-2", key: "inlet" },
      { label: "Outlet", color: "--series-3", key: "outlet" },
    ],
  }, {
    source: "pump", title: "Pump speed", unit: "%", decimals: 0, min: 0, max: 100, height: 180,
    series: [{ label: "Pump speed", color: "--series-1", key: "speed" }],
  }],
  live: (m) => Object.assign({ pump: { t: m.time, speed: m.solarPump } },
    m.temps ? { solar: { t: m.temps.time, collector: m.temps.solarCollector, inlet: m.temps.solarInlet, outlet: m.temps.solarOutlet } } : {}),
});
</script>
</body>
</html>
