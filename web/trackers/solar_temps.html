<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar hot water temperatures</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Solar hot water temperatures</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Solar hot water temperatures",
  sub: "Solar collector, and the water going into and coming out of it.",
  sources: {
    solar: { url: "/realtime/getsolartemps", map: (r) => ({ collector: r.SolarCollector, inlet: r.SolarInlet, outlet: r.SolarOutlet }) },
  },
  charts: [{
    source: "solar", unit: "°C", decimals: 1, minSpan: 10, gapMs: 600000, height: 320,
    series: [
      { label: "Collector", color: "--series-1", key: "collector" },
      { label: "Inlet", color: "--series-2", key: "inlet" },
      { label: "Outlet", color: "--series-3", key: "outlet" },
    ],
  }],
  live: (m) => m.temps && { solar: { t: m.temps.time, collector: m.temps.solarCollector, inlet: m.temps.solarInlet, outlet: m.temps.solarOutlet } },
});
</script>
</body>
</html>
