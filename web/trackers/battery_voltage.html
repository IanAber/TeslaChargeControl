<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery voltage</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Battery voltage</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Battery voltage",
  sub: "Battery voltage against the charge setpoint.",
  ranges: [30, 60, 120, 240, 480, 720, 1440],
  sources: {
    volts: { url: "/realtime/getVoltage", map: (r) => ({ volts: r.volts, setpoint: r.volts_setpoint }) },
  },
  charts: [
    { source: "volts", title: "Battery voltage", unit: "V", decimals: 2, minSpan: 2, height: 320,
      series: [{ label: "Battery", color: "--series-1", key: "volts" }, { label: "Setpoint", color: "--series-2", dash: "dash", key: "setpoint" }] },
  ],
  live: (m) => ({ volts: { t: m.time, volts: m.inverter.vBatt, setpoint: m.inverter.vSetpoint } }),
});
</script>
</body>
</html>
