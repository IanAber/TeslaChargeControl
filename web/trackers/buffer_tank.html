<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buffer tank temperatures</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Buffer tank temperatures</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Buffer tank temperatures",
  sub: "Top, middle and bottom of the buffer tank. One-minute averages.",
  sources: {
    tank: { url: "/realtime/getbuffertank", map: (r) => ({ top: r.TSC1, middle: r.TSC2, bottom: r.TSC0 }) },
  },
  charts: [{
    source: "tank", unit: "°C", decimals: 1, minSpan: 10, gapMs: 600000, height: 320,
    series: [
      { label: "Top", color: "--series-1", key: "top" },
      { label: "Middle", color: "--series-2", key: "middle" },
      { label: "Bottom", color: "--series-3", key: "bottom" },
    ],
  }],
  live: (m) => m.temps && { tank: { t: m.temps.time, top: m.temps.bufferTankTop, middle: m.temps.bufferTankMiddle, bottom: m.temps.bufferTankBottom } },
});
</script>
</body>
</html>
