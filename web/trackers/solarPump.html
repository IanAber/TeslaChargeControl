<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar pump</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Solar pump</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Solar pump",
  sub: "Solar hot water pump speed. The controller logs a value each time it changes.",
  sources: {
    pump: { url: "/realtime/getpumps", step: true, map: (r) => ({ speed: r.power }) },
  },
  charts: [{
    source: "pump", unit: "%", decimals: 0, min: 0, max: 100, height: 260,
    series: [{ label: "Pump speed", color: "--series-1", key: "speed" }],
  }],
  live: (m) => ({ pump: { t: m.time, speed: m.solarPump } }),
});
</script>
</body>
</html>
