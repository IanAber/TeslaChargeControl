<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inverter power</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Inverter power</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "Inverter power",
  sub: "Power through the Sunny Island inverters.",
  ranges: [15, 30, 60, 120, 240, 480, 720, 1440, 2880, 4320, 10080],
  sources: {
    inv: { url: "/realtime/getCurrent", map: (r) => ({ power: r.power }) },
  },
  charts: [{
    source: "inv", title: "Inverter power", unit: "kW", decimals: 2, zero: true, minSpan: 2, height: 320,
    series: [{ label: "Power", color: "--series-1", key: "power" }],
  }],
  live: (m) => ({ inv: { t: m.time, power: m.inverter.power } }),
});
</script>
</body>
</html>
