<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House battery</title>
<link rel="stylesheet" href="../scripts/sc.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">House battery</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <nav><a href="../ac_status.html">System status</a></nav>
  </header>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls"></div>
  <section class="card" id="charts"></section>
</main>
<script src="../scripts/sc.js"></script>
<script src="../scripts/tracker.js"></script>
<script>
SC.tracker({
  title: "House battery",
  sub: "Battery current, voltage and state of charge, and the mains frequency, from the Sunny Island inverters and the BMS.",
  ranges: [15, 30, 60, 120, 240, 480, 720, 1440, 2880, 4320, 10080],
  sources: {
    inv: { url: "/realtime/getCurrent", map: (r) => ({ amps: r.amps, volts: r.volts, setpoint: r.setpoint, frequency: r.frequency, soc: r.state_of_charge }) },
  },
  charts: [
    { source: "inv", title: "Current (+ charging)", unit: "A", decimals: 1, zero: true, minSpan: 20, height: 220,
      series: [{ label: "Current", color: "--series-1", key: "amps" }] },
    { source: "inv", title: "Voltage", unit: "V", decimals: 2, minSpan: 2, height: 200,
      series: [{ label: "Battery", color: "--series-1", key: "volts" }, { label: "Setpoint", color: "--series-2", dash: "dash", key: "setpoint" }] },
    { source: "inv", title: "State of charge", unit: "%", decimals: 0, min: 0, max: 100, height: 160,
      series: [{ label: "SOC", color: "--series-1", key: "soc" }] },
    { source: "inv", title: "Frequency", unit: "Hz", decimals: 2, minSpan: 1, height: 160,
      series: [{ label: "Frequency", color: "--series-1", key: "frequency" }] },
  ],
  live: (m) => ({ inv: { t: m.time, amps: m.bms.iBat, volts: m.inverter.vBatt, setpoint: m.inverter.vSetpoint,
                         frequency: m.inverter.frequency, soc: m.inverter.soc } }),
});
</script>
</body>
</html>
